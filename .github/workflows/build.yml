name: Build and preview release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: rustup show
      - name: Check owned Rust formatting
        run: cargo fmt --package plico -- --check
      - name: Core lint checks
        run: cargo clippy --locked --no-default-features --all-targets
      - name: Install pinned test runner
        run: cargo install cargo-nextest --version 0.9.150 --locked
      - name: Check launcher formatting and isolation
        run: |
          cargo fmt --manifest-path tools/test-runner/Cargo.toml -- --check
          cargo test --locked --manifest-path tools/test-runner/Cargo.toml
      - name: Isolated core regressions
        run: cargo run --locked --manifest-path tools/test-runner/Cargo.toml -- core
      - name: Rust documentation tests
        run: cargo test --locked --no-default-features --doc
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: linux-core-test-results
          path: artifacts/test-runs/
          if-no-files-found: warn
  desktop-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake pkg-config libssl-dev libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev
      - run: rustup show
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-desktop-deps-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: linux-desktop-deps-
      - name: Install pinned test runner
        run: cargo install cargo-nextest --version 0.9.150 --locked
      - name: Desktop state and lifecycle regressions
        run: cargo run --locked --manifest-path tools/test-runner/Cargo.toml -- desktop
      # Preserve both debug assertions and release-assertion navigation coverage.
      - name: Cross-file keyboard and pointer regressions
        run: cargo run --locked --manifest-path tools/test-runner/Cargo.toml -- navigation
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: linux-desktop-test-results
          path: artifacts/test-runs/
          if-no-files-found: warn
  windows-test:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Native toolchain
        shell: pwsh
        run: |
          rustup show
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (-not (Test-Path (Join-Path $llvmBin 'llvm-rc.exe'))) { throw 'LLVM resource compiler is required' }
          $llvmBin >> $env:GITHUB_PATH
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-tests-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'vendor/**', 'build.rs') }}
          restore-keys: windows-tests-
      - name: Install pinned test runner
        run: cargo install cargo-nextest --version 0.9.150 --locked
      - name: Launcher isolation regressions
        run: cargo test --locked --manifest-path tools/test-runner/Cargo.toml
      - name: Complete native core and desktop regressions
        run: cargo run --locked --manifest-path tools/test-runner/Cargo.toml -- all
      - name: Rust documentation tests
        run: cargo test --locked --no-default-features --doc
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-test-results
          path: artifacts/test-runs/
          if-no-files-found: warn
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Toolchain
        shell: pwsh
        run: |
          rustup show
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          'C:\Program Files\LLVM\bin' >> $env:GITHUB_PATH
          rustc --version
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-release-${{ hashFiles('Cargo.lock', 'vendor/**', 'build.rs') }}
          restore-keys: windows-release-
      # Offline packaging also reads metadata for test/build dependencies.
      - name: Fetch locked Windows dependencies
        run: cargo fetch --locked --target x86_64-pc-windows-msvc
      # Accepted socket mode differs from Linux; compile-only cannot catch it.
      - name: Test Windows hosting and OAuth transport
        run: 'cargo test --locked --no-default-features --lib --target x86_64-pc-windows-msvc hosting::'
      - name: Test Windows credential persistence
        run: 'cargo test --locked --no-default-features --lib --target x86_64-pc-windows-msvc credential_store::windows_tests::'
      - name: Test Windows process-tree cleanup
        run: 'cargo test --locked --no-default-features --test process_tree --target x86_64-pc-windows-msvc'
      - name: Build Windows executable and helpers
        env:
          PLICO_GITHUB_CLIENT_SECRET: ${{ secrets.PLICO_GITHUB_CLIENT_SECRET }}
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bins
      - name: Package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          $version = (Get-Content Cargo.toml | Select-String '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($env:IS_TAG -eq 'true' -and $env:RELEASE_TAG -ne "v$version") { throw 'Tag must match Cargo package version' }
          python scripts/package-windows.py "dist/Plico-$version-windows-x64.zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, desktop-test, windows-test, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-x64
          path: dist
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --prerelease \
            --title "Plico $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
